{# Campos reutilizáveis de personalização de layout em milímetros (cfg = form_data ou layout) #}
<div class="row g-3">
    <div class="col-12">
        <label class="form-label">Formato Predefinido de Etiqueta</label>
        <select class="form-select" name="preset">
            {% for key, p in presets.items() %}
                <option value="{{ key }}" {% if (cfg.preset | string) == key %}selected{% endif %}>
                    {{ p.name }}
                </option>
            {% endfor %}
        </select>
        <div class="form-text">Escolha um gabarito pronto ou altere qualquer medida abaixo para personalizar livremente.</div>
    </div>

    <div class="col-md-6">
        <label class="form-label">Tamanho da Folha</label>
        <select class="form-select" name="page_format">
            {% for key, fmt in page_formats.items() %}
                <option value="{{ key }}" {% if (cfg.page_format | string) == key %}selected{% endif %}>
                    {{ fmt.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Larg. Folha (mm)</label>
        <input type="number" step="0.1" min="30" max="1000" class="form-control" name="page_width_mm" value="{{ cfg.page_width_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Alt. Folha (mm)</label>
        <input type="number" step="0.1" min="25" max="1500" class="form-control" name="page_height_mm" value="{{ cfg.page_height_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Larg. Etiqueta (mm)</label>
        <input type="number" step="0.1" min="22" max="500" class="form-control" name="label_width_mm" value="{{ cfg.label_width_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Alt. Etiqueta (mm)</label>
        <input type="number" step="0.1" min="16" max="500" class="form-control" name="label_height_mm" value="{{ cfg.label_height_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Colunas / Folha</label>
        <input type="number" step="1" min="1" max="12" class="form-control" name="columns" value="{{ cfg.columns }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Linhas / Folha</label>
        <input type="number" step="1" min="1" max="30" class="form-control" name="rows" value="{{ cfg.rows }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Espaço Horiz. (mm)</label>
        <input type="number" step="0.1" min="0" max="100" class="form-control" name="gap_x_mm" value="{{ cfg.gap_x_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Espaço Vert. (mm)</label>
        <input type="number" step="0.1" min="0" max="100" class="form-control" name="gap_y_mm" value="{{ cfg.gap_y_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">QR Code (mm)</label>
        <input type="number" step="0.5" min="12" max="200" class="form-control" name="qr_size_mm" value="{{ cfg.qr_size_mm }}" required>
    </div>

    <div class="col-6 col-md-3">
        <label class="form-label">Fonte Número (pt)</label>
        <input type="number" step="0.5" min="6" max="42" class="form-control" name="font_size_pt" value="{{ cfg.font_size_pt }}" required>
    </div>

    <div class="col-12">
        <label class="form-label mb-1">Margens da Página (mm)</label>
        <div class="row g-2">
            <div class="col-6 col-sm-3">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light">Sup.</span>
                    <input type="number" step="0.1" min="0" max="150" class="form-control" name="margin_top_mm" value="{{ cfg.margin_top_mm }}" required>
                </div>
            </div>
            <div class="col-6 col-sm-3">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light">Dir.</span>
                    <input type="number" step="0.1" min="0" max="150" class="form-control" name="margin_right_mm" value="{{ cfg.margin_right_mm }}" required>
                </div>
            </div>
            <div class="col-6 col-sm-3">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light">Inf.</span>
                    <input type="number" step="0.1" min="0" max="150" class="form-control" name="margin_bottom_mm" value="{{ cfg.margin_bottom_mm }}" required>
                </div>
            </div>
            <div class="col-6 col-sm-3">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light">Esq.</span>
                    <input type="number" step="0.1" min="0" max="150" class="form-control" name="margin_left_mm" value="{{ cfg.margin_left_mm }}" required>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <label class="form-label">Texto Personalizado na Etiqueta <span class="text-muted fw-normal">(opcional)</span></label>
        <input
            type="text"
            maxlength="45"
            class="form-control"
            name="custom_text"
            placeholder="Ex.: Fazenda Santa Helena • Setor Norte"
            value="{{ custom_text_val or '' }}"
        >
    </div>

    <div class="col-md-4 d-flex align-items-end">
        <div class="form-check form-switch mb-2">
            {% set border_checked = (cfg.show_border | string | lower) in ('true', '1', 'on', 'yes') %}
            <input class="form-check-input" type="checkbox" role="switch" id="showBorderSwitch" name="show_border" value="true" {% if border_checked %}checked{% endif %}>
            <label class="form-check-label small fw-semibold" for="showBorderSwitch">Guia tracejada de corte</label>
        </div>
    </div>
</div>
